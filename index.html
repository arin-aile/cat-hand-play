<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>Cat Hand Play</title>
<style>
  * {box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
  #camera,#stage,#hands{position:fixed;inset:0;width:100%;height:100%}
  #camera{object-fit:cover;transform:scaleX(-1);opacity:.115;filter:grayscale(1) contrast(.76) brightness(1.35)}
  #stage{z-index:1;pointer-events:none}#stage canvas{display:block;width:100%;height:100%}#hands{z-index:2;pointer-events:none;opacity:.40}
  #emotion{z-index:3;position:fixed;top:18%;left:50%;transform:translate(-50%,-50%) scale(.7);font-size:clamp(26px,4vw,38px);pointer-events:none;opacity:0;transition:opacity .22s,transform .25s;filter:drop-shadow(0 4px 6px #0001)}
  #emotion.visible{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #begin{position:fixed;z-index:5;inset:0;border:0;background:transparent;cursor:pointer;touch-action:manipulation}
  #begin:focus-visible{outline:3px solid #999;outline-offset:-6px}
  #startIcon{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#ffffffda;box-shadow:0 5px 30px #00000012;font-size:33px}
  #startHint{position:absolute;left:50%;top:calc(88% + 12px);transform:translateX(-50%);width:max-content;max-width:90vw;font:12px/1.7 system-ui,sans-serif;color:rgba(65,72,80,.48);text-align:center;letter-spacing:.01em}
  #status{position:fixed;z-index:6;left:50%;bottom:6%;transform:translateX(-50%);font:14px system-ui,sans-serif;color:#595959;background:#fffffff0;padding:9px 16px;border-radius:24px;display:none;width:max-content;max-width:90vw;text-align:center}
  #guide{position:fixed;z-index:4;left:clamp(16px,3vw,44px);top:50%;transform:translateY(-50%);font:13px/1.85 system-ui,sans-serif;color:rgba(65,72,80,.52);pointer-events:none;user-select:none}
  #guide p{margin:0 0 12px;font-size:11px;opacity:.8}#guide ul{list-style:none;margin:0;padding:0}#guide li{transition:color .2s}#guide li.active{color:rgba(75,105,90,.95)}#handFeedback{margin-top:14px;font-size:11px}
  @media(max-width:600px){#guide{top:24px;transform:none;font-size:11px;line-height:1.7}#guide p,#handFeedback{font-size:10px}}
  @media(max-height:500px){#startHint{top:calc(88% + 7px);font-size:11px;line-height:1.45}}
  @media(prefers-reduced-motion:reduce){#emotion{transition:none}}
</style>
</head>
<body>
<video id="camera" autoplay muted playsinline></video>
<canvas id="hands" aria-hidden="true"></canvas>
<div id="stage" aria-hidden="true"></div>
<div id="emotion" aria-hidden="true"></div>
<button id="begin" aria-label="카메라를 켜고 고양이와 놀기"><span id="startIcon" aria-hidden="true">🐾</span><span id="startHint">발바닥을 콕! 카메라를 켜주면<br>같이 놀 수 있어요 🐾</span></button>
<div id="status" role="status"></div>
<aside id="guide" aria-label="손가락 놀이 안내">
<p>손끝으로 살짝 닿아 주세요<br>펼친 손가락 수 · 엄지 제외</p>
<ul><li data-count="1">1개 · ❤️ 쓰다듬기</li><li data-count="2">2개 · ❗ 놀라 달아나기</li><li data-count="3">3개 · 💢 펄쩍 뛰기</li><li data-count="4">4개 · 💤 잠들기</li></ul>
<div id="handFeedback">손을 보여 주세요</div>
</aside>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script>
if (location.protocol === 'file:') {
  document.querySelector('#begin').style.display = 'none';
  const status = document.querySelector('#status');
  status.textContent = '파일을 직접 열면 실행되지 않아요. ';
  const link = document.createElement('a');
  link.href = 'https://arin-aile.github.io/cat-hand-play/';
  link.textContent = '배포된 고양이 앱 열기';
  status.appendChild(link);
  status.style.display = 'block';
} else {
  import('./main.js?v=9').catch(error => {
    console.error(error);
    const status = document.querySelector('#status');
    status.textContent = '앱을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.';
    status.style.display = 'block';
  });
}
</script>
</body>
</html>
